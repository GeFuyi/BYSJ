server:
  port: 8080

spring:
  application:
    name: community-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/community_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${COMMUNITY_DB_PASSWORD:123456}
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.community.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${COMMUNITY_JWT_SECRET:community-service-jwt-secret-key-2026-0123456789}
  expiration: 86400000

sms:
  access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
  access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
  region: ap-southeast-1
  endpoint: dypnsapi.aliyuncs.com
  scheme-name: ${SMS_SCHEME_NAME:TestScheme}
  default-country-code: "86"
  default-phone-number: "15138114047"
  sign-name: ${SMS_SIGN_NAME:}
  template-code: ${SMS_TEMPLATE_CODE:}
  template-param: '{"code":"##code##","min":"5"}'
  sms-up-extend-code: ""
  code-length: 6
  valid-time: 300
  duplicate-policy: 1
  interval-seconds: 60
  code-type: 1
  return-verify-code: false
  case-auth-policy: 1

repair:
  upload-dir: uploads/repair
  max-file-size-mb: 10

service-platform:
  upload-dir: uploads/service
  max-file-size-mb: 10

social:
  upload-dir: uploads/social
  max-file-size-mb: 10

alipay:
  enabled: ${ALIPAY_ENABLED:true}
  gateway-url: https://openapi.alipay.com/gateway.do
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  access-token: ${ALIPAY_ACCESS_TOKEN:}
  app-auth-token: ${ALIPAY_APP_AUTH_TOKEN:}
  charset: UTF-8
  sign-type: RSA2
  format: json
  # notify-url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8080/api/electricity/notify}
  notify-url: ${ALIPAY_NOTIFY_URL:https://veronika-overclean-charla.ngrok-free.dev/api/electricity/notify}
  default-order-type: JF
  default-sub-order-type: ELEC
  default-charge-inst: ${ALIPAY_DEFAULT_CHARGE_INST:国网河南省电力公司（新蔡）}
  default-province: ${ALIPAY_DEFAULT_PROVINCE:河南}
  default-city: ${ALIPAY_DEFAULT_CITY:驻马店}
  default-bill-key: ${ALIPAY_DEFAULT_BILL_KEY:4107880059197}
  default-owner-name: ${ALIPAY_DEFAULT_OWNER_NAME:社区住户}
  subject-prefix: ${ALIPAY_SUBJECT_PREFIX:社区电费代缴}
  timeout-express: ${ALIPAY_TIMEOUT_EXPRESS:15m}

logging:
  level:
    com.community.mapper: debug

shiro:
  enabled: false
  annotations:
    enabled: false
  web:
    enabled: false
